[project]
name = "sample-pyside6-desktop"
version = "0.1.0"
description = "Reference native Python PySide6 desktop pilot validated with desktop-spec"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
