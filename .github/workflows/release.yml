name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is ancestor of origin/main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches pyproject.toml and SemVer rules
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match pyproject.toml ($PYPROJECT_VERSION)" >&2
            exit 1
          fi
          python scripts/bump_version.py --check

      - name: Run unit tests
        run: python -m unittest discover -s cli/tests -v

      - name: Build sdist and wheel (Hatchling)
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Smoke test installed wheel entrypoints
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/desktop-spec --version
          /tmp/smoke-venv/bin/dspec --version

      - name: Extract release notes from CHANGELOG.md
        run: |
          python -c '
          import os, re
          from pathlib import Path
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(rf"^## \[{re.escape(tag)}\].*?(?=^## \[|\Z)", re.MULTILINE | re.DOTALL)
          m = pattern.search(text)
          notes = m.group(0).strip() if m else f"Release v{tag}"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          '

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
